<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極複利退休金計算機</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --principal-color: #238636;
            --interest-color: #d29922;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 22px;
            text-align: center;
            color: #fff;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .input-with-unit {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            padding-right: 40px; 
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .unit {
            position: absolute;
            right: 15px;
            color: #8b949e;
            font-size: 16px;
            pointer-events: none;
        }
        .result-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
        }
        .total-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }
        .error-message {
            color: #ff7b72;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .chart-container {
            margin-top: 20px;
        }
        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .progress-bar {
            height: 24px;
            background-color: #21262d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }
        .bar-principal {
            background-color: var(--principal-color);
            transition: width 0.3s ease;
        }
        .bar-interest {
            background-color: var(--interest-color);
            transition: width 0.3s ease;
        }
        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 13px;
        }
        .legend {
            display: flex;
            align-items: center;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .footer-credit {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
            margin-top: 14px;
            padding: 8px 0 4px;
            font-size: 13px;
        }

        .footer-credit a {
            color: #8b949e;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-credit a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        /* 介面與手機版優化 */
        input[type="number"] {
            min-height: 46px;
            padding-right: 54px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, .14);
        }

        .unit {
            right: 34px; /* 避開瀏覽器原生上下箭頭 */
            background-color: var(--bg-color);
            padding-left: 6px;
        }

        .field-hint {
            margin-top: 6px;
            font-size: 12px;
            color: #8b949e;
            line-height: 1.45;
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px 16px;
                border-radius: 10px;
            }

            h1 {
                font-size: 20px;
            }

            .grid-inputs {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .total-amount {
                font-size: 26px;
                overflow-wrap: anywhere;
            }

            .details {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .chart-label {
                gap: 12px;
                line-height: 1.4;
            }
        }

    </style>
</head>
<body>

<div class="container">
    <h1>終極複利退休金計算機</h1>
    <div class="subtitle" id="timeSummary">複利長跑計算中...</div>
    
    <div class="grid-inputs">
        <div class="input-group">
            <label>目前年齡</label>
            <div class="input-with-unit">
                <input type="number" id="currentAge" value="38" min="0" max="100" step="1" inputmode="numeric" oninput="runSimulation()">
                <span class="unit">歲</span>
            </div>
        </div>
        <div class="input-group">
            <label>預計退休年齡</label>
            <div class="input-with-unit">
                <input type="number" id="retirementAge" value="65" min="0" max="100" step="1" inputmode="numeric" oninput="runSimulation()">
                <span class="unit">歲</span>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>每月預計存入金額</label>
        <div class="input-with-unit">
            <input type="number" id="monthlyAmount" value="10000" min="0" step="100" inputmode="numeric" oninput="runSimulation()">
            <span class="unit">元</span>
        </div>
        <div class="field-hint">以每月固定投入、每月複利的方式估算。</div>
    </div>
    
    <div class="input-group">
        <label>預期年化報酬率</label>
        <div class="input-with-unit">
            <input type="number" id="annualRate" value="8" min="0" max="100" step="0.01" inputmode="decimal" oninput="runSimulation()">
            <span class="unit">%</span>
        </div>
        <div class="field-hint">此為固定年化報酬率的試算值，未計入稅費、通膨與報酬波動。</div>
    </div>
    
    <div class="result-box">
        <div id="resultTitle">退休時預估總資產</div>
        <div class="total-amount" id="totalAsset">NT$ 0</div>
        <div class="error-message" id="errorMessage">錯誤：目前年齡必須小於退休年齡！</div>
        
        <div class="chart-container" id="chartZone">
            <div class="chart-label">
                <span style="color:var(--principal-color)">累積本金占比</span>
                <span style="color:var(--interest-color)">複利獲利占比</span>
            </div>
            <div class="progress-bar">
                <div class="bar-principal" id="barPrincipal" style="width: 50%"></div>
                <div class="bar-interest" id="barInterest" style="width: 50%"></div>
            </div>
        </div>
        
        <div class="details" id="detailsZone">
            <div class="legend">
                <div class="dot" style="background-color:var(--principal-color)"></div>
                <span>總投入本金: <span id="totalPrincipal" style="font-weight:bold">0</span></span>
            </div>
            <div class="legend">
                <div class="dot" style="background-color:var(--interest-color)"></div>
                <span>預估複利收益: <span id="totalInterest" style="font-weight:bold">0</span></span>
            </div>
        </div>
    </div>
</div>

<div class="footer-credit"><a href="https://line.me/ti/p/8ME9dv69et" target="_blank" rel="noopener noreferrer">© 電腦玩家工作室｜免費提供使用</a></div>

<script>
    function runSimulation() {
        const currentAge = parseInt(document.getElementById('currentAge').value) || 0;
        const retirementAge = parseInt(document.getElementById('retirementAge').value) || 0;
        const monthlyInvestment = parseFloat(document.getElementById('monthlyAmount').value) || 0;
        const annualRateInput = parseFloat(document.getElementById('annualRate').value) || 0;
        
        const errorMsg = document.getElementById('errorMessage');
        const chartZone = document.getElementById('chartZone');
        const detailsZone = document.getElementById('detailsZone');
        const totalAssetDisplay = document.getElementById('totalAsset');
        const timeSummary = document.getElementById('timeSummary');

        // 邏輯檢查：如果目前年齡大於或等於退休年齡，防呆擋下
        if (currentAge >= retirementAge) {
            errorMsg.style.display = 'block';
            chartZone.style.display = 'none';
            detailsZone.style.display = 'none';
            totalAssetDisplay.innerText = '---';
            timeSummary.innerText = '時間參數錯誤';
            return;
        } else {
            errorMsg.style.display = 'none';
            chartZone.style.display = 'block';
            detailsZone.style.display = 'flex';
        }

        const years = retirementAge - currentAge;
        const totalMonths = years * 12;
        const annualRate = annualRateInput / 100;
        
        timeSummary.innerText = `目標：${retirementAge}歲退休（複利長跑 ${years} 年 / ${totalMonths} 個月）`;
        document.getElementById('resultTitle').innerText = `${retirementAge}歲時連本帶利總金額`;

        let totalAmount = 0;
        let totalPrincipal = monthlyInvestment * totalMonths;
        
        if (annualRate === 0) {
            totalAmount = totalPrincipal;
        } else {
            const monthlyRate = annualRate / 12;
            for (let month = 1; month <= totalMonths; month++) {
                totalAmount = (totalAmount + monthlyInvestment) * (1 + monthlyRate);
            }
        }
        
        let totalInterest = totalAmount - totalPrincipal;
        if (totalInterest < 0) totalInterest = 0;
        
        let principalPercent = 50;
        let interestPercent = 50;
        
        if (totalAmount > 0) {
            principalPercent = (totalPrincipal / totalAmount) * 100;
            interestPercent = (totalInterest / totalAmount) * 100;
        }
        
        // 介面渲染
        totalAssetDisplay.innerText = 'NT$ ' + Math.round(totalAmount).toLocaleString();
        document.getElementById('totalPrincipal').innerText = 'NT$ ' + Math.round(totalPrincipal).toLocaleString();
        document.getElementById('totalInterest').innerText = 'NT$ ' + Math.round(totalInterest).toLocaleString();
        
        document.getElementById('barPrincipal').style.width = principalPercent + '%';
        document.getElementById('barInterest').style.width = interestPercent + '%';
    }

    // 初始化開機
    runSimulation();
</script>

</body>
</html>
